<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign in · Career Atlas</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#112d38;font:15px system-ui;color:#203343}main{background:white;padding:38px;border-radius:16px;width:min(420px,92vw)}h1{font-size:27px;margin:0 0 12px}p{color:#71828d;line-height:1.6}label{display:block;margin-top:24px}input,button{font:inherit;width:100%;padding:13px;border-radius:8px;margin-top:10px;border:1px solid #cfdde1}button{background:#168b7d;color:white;cursor:pointer;border:0;margin-top:20px}#error{color:#a13333}b{color:#168b7d}</style><main><h1><b>↗</b> Career Atlas</h1><p>Your applications, referrals and preparation. Private and synced across devices.</p><form id="login"><label for="password">Workspace password</label><input id="password" name="password" type="password" autocomplete="current-password" required><button>Sign in</button><p id="error" role="alert"></p></form></main><script>document.querySelector('#login').onsubmit=async e=>{e.preventDefault();const button=e.target.querySelector('button');button.disabled=true;try{const r=await fetch('/api/login',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({password:document.querySelector('#password').value})});const result=await r.json();if(!r.ok)throw Error(result.error||'Sign in failed');location.href='/'}catch(e){document.querySelector('#error').textContent=e.message;button.disabled=false}};</script></html>

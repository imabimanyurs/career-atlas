async function syncFeed(s){try{const r=await fetch('./jobs.json?t='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error();const feed=await r.json();for(const j of feed.jobs||[]){if(!j.id||!j.company||!j.role)continue;let old=s.jobs.find(x=>x.id===j.id);if(old){for(const k of REMOTE_JOB_FIELDS)if(k in j)old[k]=j[k]}else s.jobs.push({...j,status:'Saved',contact:'',applicationDate:'',interviewStage:'',notes:'',gaps:j.gaps||''})}s.runs=feed.runs||s.runs;s.feedCheckedAt=new Date().toISOString();s.feedError='';}catch{s.feedError='Daily feed could not be refreshed. Showing previously saved data.'}return s}

function saveWorkspace(s){pendingSaves++;const task=saveQueue.then(async()=>{const r=await fetch('/api/state',{method:'PUT',headers:{'content-type':'application/json'},body:JSON.stringify(s)});const result=await r.json();if(r.status===401){location.href='/login';throw Error('Sign in required')}if(!r.ok)throw Error(result.error||'Save failed');s.revision=result.revision;return {ok:true}}).finally(()=>pendingSaves--);saveQueue=task.catch(()=>{});return task}

function stats(){return '<div class="stats">'+[['Officially verified',S.jobs.filter(current).length,'Checked within 48 hours'],['Active applications',S.jobs.filter(j=>!['Saved','Rejected','Withdrawn','Offer'].includes(j.status)).length,'Your application pipeline'],['Target companies',S.companies.length,S.companies.filter(c=>c.saved).length+' shortlisted'],['Preparation',Math.round(S.prep.filter(p=>p.done).length/S.prep.length*100)+'%','Build your interview confidence']].map(a=>'<div class="stat"><span>'+a[0]+'</span><strong>'+a[1]+'</strong><small class="muted">'+a[2]+'</small></div>').join('')+'</div>'}

function render(){$('#nav').innerHTML=views.map((v,i)=>'<button class="'+(v===view?'active':'')+'" onclick="go(\''+v+'\')">'+['◫','⌕','▤','◇','✓','◷','⚙'][i]+'&nbsp;&nbsp;'+v+'</button>').join('');$('#crumb').textContent=view;let h='<div class="head"><div><h1>'+({'Overview':'Your next chapter starts here.','Job board':'Discover your next opportunity.','Applications':'From first contact to offer.','Target companies':'Build your company shortlist.','Preparation':'Be ready for the opportunity.','Search activity':'Every search, accounted for.','Settings':'Make this workspace yours.'}[view])+'</h1><p>Java, Spring Boot & React · Your overseas software engineering workspace</p></div><button class="primary" onclick="editJob()">+ Add opportunity</button></div>';
if(view==='Overview')h+=stats()+'<div class="banner">✓ Evidence first. A role is current only after an official vacancy check. Sponsorship requires explicit evidence. Verification expires after 48 hours.</div><div class="grid"><section class="panel"><div class="head"><h2>Your opportunity pipeline</h2><button class="link" onclick="go(\'Applications\')">View tracker →</button></div>'+['Saved','Referral requested','Applied','Interview','Offer'].map(st=>'<div class="row">'+st+tag(S.jobs.filter(j=>j.status===st).length)+'</div>').join('')+'</section><section class="panel"><h2>Priority markets</h2><p>Search order · editable in settings</p>'+S.settings.countries.split(',').slice(0,5).map((c,i)=>'<div class="row">'+esc(c.trim())+tag(i<3?'Priority':'Explore',i<3?'':'neutral')+'</div>').join('')+'</section><section class="panel"><h2>Your preparation checklist</h2>'+checks(4)+'</section><section class="panel"><h2>A repeatable referral workflow</h2><p>'+esc(S.settings.workflow)+'</p><button onclick="go(\'Target companies\')">Open your watchlist →</button><p class="muted">No outreach messages are sent automatically.</p></section></div>';
if(['Job board','Applications'].includes(view)){h+='<div class="filters"><input type="search" placeholder="Search company, role, skill or job ID…" oninput="query=this.value;jobList()"><input placeholder="Country…" oninput="F.country=this.value;jobList()">'+select('sponsorship',['Confirmed','Uncertain','Not offered'],'All sponsorship')+select('source',['Official career page','Third-party listing'],'All sources')+select('age',['New: last 7 days','Older','Unknown date'],'All posting dates')+select('fit',['Strong fit'],'All matches')+select('verification',['Verified current','Needs verification'],'All verification')+'</div><div id="jobs"></div>'}
if(view==='Target companies')h+='<div class="filters"><input type="search" placeholder="Search all 403 companies…" oninput="query=this.value;companies()"><button onclick="F.saved=!F.saved;companies()">★ Shortlist only</button><button onclick="editCompany(-1)">+ Add company</button></div><div class="cards" id="companies"></div>';
if(view==='Preparation')h+=stats()+'<section class="panel"><h2>Preparation checklist</h2>'+checks()+'<div class="actions"><button onclick="addTask()">+ Add task</button></div></section><section class="panel"><h2>Skill gaps from your roles</h2>'+S.jobs.filter(j=>j.gaps).map(j=>'<div class="row"><b>'+esc(j.company)+'</b><span>'+esc(j.gaps)+'</span></div>').join('')+'<p class="muted">Add role-specific gaps when saving opportunities.</p></section>';
if(view==='Search activity')h+='<div class="banner">Daily coverage must report companies checked, blocked sources and unfinished work. Application statuses and referral notes are saved privately on the server. A scheduled run does not guarantee every one of the 403 sources is reachable.</div><section class="panel"><h2>Search history</h2><button onclick="refreshJobs()">Refresh job feed</button>'+(S.runs.length?S.runs.map(r=>'<div class="row"><span>'+esc(r.at)+'</span><p>'+esc(JSON.stringify(r))+'</p></div>').join(''):'<div class="empty">No completed search run yet.</div>')+'</section><section class="panel"><h2>Government & PSU · India</h2><p>Check official notice, degree branch, age cut-off, OBC-NCL certificate rules, GATE requirements, experience, fee and deadline. Eligibility is not assumed.</p>'+[['UPSC','https://upsc.gov.in/recruitment'],['SSC','https://ssc.gov.in'],['NIELIT / NIC','https://www.nielit.gov.in/recruitments'],['ISRO','https://www.isro.gov.in/Careers.html'],['DRDO','https://www.drdo.gov.in/drdo/careers'],['Employment News','https://employmentnews.gov.in/']].map(a=>'<a class="chip" href="'+a[1]+'" target="_blank" rel="noopener">'+a[0]+' ↗</a>').join('')+'</section>';
if(view==='Settings')h+='<section class="panel"><h2>Search preferences & referral workflow</h2><div class="form">'+Object.entries(S.settings).map(([k,v])=>'<label>'+esc(k)+'<textarea id="s-'+k+'">'+esc(v)+'</textarea></label>').join('')+'</div><div class="actions"><button class="primary" onclick="settings()">Save preferences</button></div></section><section class="panel"><h2>Reuse your records</h2><p>Export a JSON backup or import an existing Career Atlas backup. Company contacts, notes and referral stages stay editable.</p><button onclick="backup()">Export JSON</button> <input aria-label="Import JSON backup" type="file" accept=".json" onchange="restore(this)"><p class="muted">Your workspace is saved privately on the server and available after signing in on another device. Daily job-feed updates preserve application statuses, contacts and notes. To migrate from GitHub Pages, export its JSON backup and import it here.</p></section>';
$('#app').innerHTML=h+(S.feedError?'<div class="banner">'+esc(S.feedError)+'</div>':'');if(['Job board','Applications'].includes(view))jobList();if(view==='Target companies')companies()}
function select(k,opts,label){return '<select aria-label="'+label+'" onchange="F.'+k+'=this.value;jobList()"><option value="">'+label+'</option>'+opts.map(x=>'<option '+(F[k]===x?'selected':'')+'>'+x+'</option>').join('')+'</select>'}
function jobList(){const list=S.jobs.filter(j=>(view!=='Applications'||j.status!=='Saved')&&JSON.stringify(j).toLowerCase().includes(query.toLowerCase())&&(!F.country||(j.country||'').toLowerCase().includes(F.country.toLowerCase()))&&['sponsorship','source','fit'].every(k=>!F[k]||j[k]===F[k])&&(!F.verification||(F.verification==='Verified current'?current(j):!current(j)))&&(!F.age||(F.age==='Unknown date'?!j.postedAt:j.postedAt&&(F.age==='New: last 7 days'?Date.now()-Date.parse(j.postedAt)<=604800000:Date.now()-Date.parse(j.postedAt)>604800000))));$('#jobs').innerHTML='<section class="panel"><h2>'+list.length+' opportunities</h2>'+(list.length?'<div class="scroll"><table><tr><th>Company / role</th><th>Location / salary</th><th>Evidence</th><th>Fit / status</th><th></th></tr>'+list.map(j=>'<tr><td><b>'+esc(j.company)+'</b><p>'+esc(j.role)+'</p><span class="muted">ID '+esc(j.jobId||'Unknown')+'</span></td><td>'+esc(j.country)+'<p>'+esc(j.location)+'</p>'+esc(j.salary||'Salary not listed')+'</td><td>'+tag(current(j)?'Verified current':'Needs verification',current(j)?'':'amber')+'<br>'+tag(j.sponsorship||'Uncertain',j.sponsorship==='Confirmed'?'':'amber')+'<p>'+esc(j.source)+'</p></td><td>'+tag(j.fit||'Not assessed','neutral')+'<p>'+esc(j.status)+'</p></td><td><button onclick="editJob(\''+esc(j.id)+'\')">Open →</button></td></tr>').join('')+'</table></div>':'<div class="empty"><div class="symbol">⌕</div><h2>No matching opportunities yet</h2><p>Add an official vacancy or researched results.<br>No sample listings are presented as current jobs.</p><button class="primary" onclick="editJob()">+ Add opportunity</button></div>')+'</section>'}
function companies(){$('#companies').innerHTML=S.companies.map((c,i)=>({...c,i})).filter(c=>c.name.toLowerCase().includes(query.toLowerCase())&&(!F.saved||c.saved)).map(c=>'<article class="company"><div class="head"><h3>'+esc(c.name)+'</h3><button onclick="S.companies['+c.i+'].saved=!S.companies['+c.i+'].saved;save()" aria-label="Save company">'+(c.saved?'★':'☆')+'</button></div>'+tag(c.stage,'neutral')+tag(c.country||'Market not set','neutral')+'<p class="muted">'+esc(c.contact||'No referral contact yet')+'</p><button onclick="editCompany('+c.i+')">Manage target →</button> '+(safe(c.careerUrl)?'<a target="_blank" rel="noopener" href="'+safe(c.careerUrl)+'">Careers ↗</a>':'')+'</article>').join('')}
const fields={company:'Company',country:'Country',role:'Role',salary:'Salary if listed',location:'Location / remote rules',experience:'Experience range',skills:'Required skills',authorisation:'Work-authorisation conditions',jobId:'Exact job ID',officialUrl:'Official application URL',listingUrl:'Discovery listing URL',postedAt:'Posted date',verifiedAt:'Officially checked at (ISO time)',evidence:'Official vacancy evidence',sponsorshipEvidence:'Explicit sponsorship evidence',sponsorshipUrl:'Sponsorship source URL',applicationDate:'Application date',contact:'Referral contact / LinkedIn URL',interviewStage:'Interview stage',gaps:'Skill gaps',notes:'Notes / deadline / eligibility'};
const enums={sponsorship:['Uncertain','Confirmed','Not offered'],source:['Official career page','Third-party listing'],verification:['Unverified','Verified current','Closed'],fit:['Not assessed','Strong fit','Partial fit','Low fit'],status:['Saved','Referral requested','Applied','Recruiter screen','Interview','Offer','Rejected','Withdrawn']};
function editJob(id){const j=S.jobs.find(j=>j.id===id)||{};$('#modal').innerHTML='<h2>Opportunity details</h2><p class="muted">Unknown is better than assumed. Record official evidence before marking current or sponsored.</p><form id="jf"><div class="form">'+Object.entries(fields).map(([k,l])=>'<label>'+l+'<input name="'+k+'" value="'+esc(j[k])+'" '+(['company','role'].includes(k)?'required':'')+' '+(k.endsWith('Url')?'type="url"':['postedAt','applicationDate'].includes(k)?'type="date"':'')+'></label>').join('')+Object.entries(enums).map(([k,opts])=>'<label>'+k+'<select name="'+k+'">'+opts.map(o=>'<option '+(j[k]===o?'selected':'')+'>'+o+'</option>').join('')+'</select></label>').join('')+'</div><div class="actions">'+(safe(j.officialUrl)?'<a href="'+safe(j.officialUrl)+'" target="_blank" rel="noopener">Official application ↗</a>':'')+'<button type="button" onclick="$(\'#modal\').close()">Cancel</button><button class="primary">Save opportunity</button></div></form>';$('#modal').showModal();$('#jf').onsubmit=e=>{e.preventDefault();let d=Object.fromEntries(new FormData(e.target));if(d.verification==='Verified current'&&(!d.officialUrl||!d.jobId||!d.verifiedAt||!d.evidence))return toast('Add official URL, exact ID, verification time and vacancy evidence.');if(d.sponsorship==='Confirmed'&&(!d.sponsorshipUrl||!d.sponsorshipEvidence))return toast('Add explicit sponsorship evidence and official source URL.');if(id)Object.assign(j,d);else S.jobs.push({...d,id:crypto.randomUUID()});$('#modal').close();save()}}
function editCompany(i){const c=S.companies[i]||{};$('#modal').innerHTML='<h2>Company & referral workflow</h2><form id="cf"><div class="form">'+['name','country','careerUrl','contact','notes'].map(k=>'<label>'+k+'<input name="'+k+'" value="'+esc(c[k])+'" '+(k==='name'?'required':'')+'></label>').join('')+'<label>Referral stage<select name="stage">'+['Research','Find referral','Contact identified','Referral requested','Referred','Applied','Follow up'].map(o=>'<option '+(c.stage===o?'selected':'')+'>'+o+'</option>').join('')+'</select></label></div><div class="actions"><button type="button" onclick="$(\'#modal\').close()">Cancel</button><button class="primary">Save target</button></div></form>';$('#modal').showModal();$('#cf').onsubmit=e=>{e.preventDefault();let d=Object.fromEntries(new FormData(e.target));if(i<0)S.companies.push({...d,saved:true});else Object.assign(c,d);$('#modal').close();save()}}
function addTask(){let title=prompt('Preparation task');if(title){S.prep.push({title,done:false});save()}}function settings(){for(let k in S.settings)S.settings[k]=$('#s-'+k).value;save()}function backup(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S,null,2)],{type:'application/json'}));a.download='career-atlas-backup.json';a.click();URL.revokeObjectURL(a.href)}async function restore(e){try{let d=JSON.parse(await e.files[0].text());if(!Array.isArray(d.jobs)||!Array.isArray(d.companies)||!Array.isArray(d.prep)||!Array.isArray(d.runs)||!d.settings)throw Error();if(confirm('Replace your workspace with this backup?')){d.revision=S.revision;S=d;save()}}catch{toast('Invalid Career Atlas backup')}}loadWorkspace().then(s=>{S=s;render()}).catch(()=>$('#app').innerHTML='<section class="panel"><h2>Workspace could not load</h2><p>Refresh to retry. No records were changed.</p></section>');
setInterval(async()=>{if(S&&!pendingSaves&&!document.querySelector('dialog[open]')&&view!=='Settings'){try{S=await loadWorkspace();render()}catch{toast('Sync unavailable. Your saved server data remains intact.')}}},300000);</script></body></html>
